project:
  name: fhir_medallion
  environment: dev
  timezone: UTC

api:
  base_url: https://hapi.fhir.org/baseR4
  format: json
  page_size: 100
  max_pages_per_window: 50
  timeout_seconds: 60
  max_retries: 5
  backoff_seconds: 2
  sort_param: _lastUpdated
  headers:
    Accept: application/fhir+json

ingestion:
  lookback_days: 3
  use_watermark: true

resources:
  - name: Patient
    enabled: true
    business_key: id
  - name: Encounter
    enabled: true
    business_key: id
  - name: Observation
    enabled: true
    business_key: id
  - name: Condition
    enabled: true
    business_key: id

storage:
  root_path: /Volumes/workspace/fhir_landing/files
  volume_schema: fhir_landing
  volume_name: files
  raw_folder: raw

catalog:
  catalog: workspace
  schemas:
    control: fhir_control
    bronze: fhir_bronze
    silver: fhir_silver
    gold: fhir_gold

tables:
  control:
    api_call_log: api_call_log
    run_log: pipeline_run_log
    watermark: ingestion_watermark
    dq_results: dq_results
  bronze_prefix: bronze_
  silver_prefix: ""
  gold:
    dim_patient: dim_patient
    dim_patient_history: dim_patient_history
    dim_date: dim_date
    fact_encounter: fact_encounter
    fact_observation: fact_observation
    fact_condition: fact_condition
    agg_daily_activity: agg_daily_activity
    agg_condition_prevalence: agg_condition_prevalence

gold:
  unknown_key: "-1"
  date_start: "2015-01-01"
  date_future_days: 365

silver:
  columns_file: silver_columns.yaml

scd2:
  hash_algorithm: sha2_256
  effective_from_col: effective_from
  effective_to_col: effective_to
  current_flag_col: is_current
  open_end_date: "9999-12-31 00:00:00"

quality:
  allowed_gender: [male, female, other, unknown]
  max_unknown_patient_ratio: 0.95
  freshness_days: 3
  fail_on_error: true
